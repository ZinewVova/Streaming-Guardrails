dataset:
  repository: inclusionAI/SingStreamBench
  revision: 957b703ca028af6aa834b95ec0893b81e4d24a71
  prepared_path: data/processed/singstreambench.parquet
model:
  adapter: scm
  repository: liyang-ict/SCM-0.5B
  revision: 55afd738531b1923c76f6e8f996172fadbcfc4ae
  tokenizer_revision: 55afd738531b1923c76f6e8f996172fadbcfc4ae
  # A token counts as harmful when its score reaches the threshold. Together with
  # trigger_count this is the Harm@k rule; 0.7 and 4 are the values the SCM authors
  # selected for the 0.5B model on the FineHarm validation split.
  threshold: 0.7
experiment:
  profile: smoke2
  seed: 42
  modes: [token, chunk_8, chunk_16, chunk_32, sentence, full_buffered]
  # SCM output is binary, so strict and conservative would coincide.
  policies:
    conservative: [unsafe]
  trigger_count: 4
  max_sentence_tokens: 128
  output_dir: data/interim/scm_0_5b
runtime:
  device: null
  resume: true
