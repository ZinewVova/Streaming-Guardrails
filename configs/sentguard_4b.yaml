dataset:
  repository: inclusionAI/SingStreamBench
  revision: 957b703ca028af6aa834b95ec0893b81e4d24a71
  prepared_path: data/processed/singstreambench.parquet
model:
  adapter: sentguard
  display_name: SentGuard-4B
  repository: Solitude0630/SentGuard
  # Nominal size, used only to express the cost of a run in FLOPs.
  parameters: 4000000000
  revision: efb202c2aefeb8a6bdf7e3eefe62cd020d499df1
  tokenizer_revision: efb202c2aefeb8a6bdf7e3eefe62cd020d499df1
  # Released checkpoint emits evidence before answer; follow its card (512),
  # rather than the paper's answer-first configuration (64).
  max_new_tokens: 512
experiment:
  profile: smoke2
  seed: 42
  # SentGuard is asked at the end of every sentence and once more on the complete response,
  # so only these two modes have their own checks.
  modes: [sentence, full_buffered]
  # strict blocks uncertain+unsafe and is the rule of the SentGuard paper; conservative
  # blocks unsafe only.
  policies:
    strict: [controversial, unsafe]
    conservative: [unsafe]
  # Each mode is replayed on the checks made at its own checkpoints.
  checkpoint_scoring: true
  # The first non-safe verdict stops the stream.
  trigger_count: 1
  max_sentence_tokens: 128
  output_dir: data/interim/sentguard_4b
runtime:
  device: null
  resume: true
