dataset:
  repository: inclusionAI/SingStreamBench
  revision: 957b703ca028af6aa834b95ec0893b81e4d24a71
  prepared_path: data/processed/singstreambench.parquet
model:
  repository: Qwen/Qwen3Guard-Stream-0.6B
  # Nominal size, used only to express the cost of a run in FLOPs.
  parameters: 600000000
  revision: 419364a715de9840d47b1457982f64ff37f90ed4
  tokenizer_revision: 419364a715de9840d47b1457982f64ff37f90ed4
experiment:
  profile: smoke2
  seed: 42
  modes: [token, chunk_8, chunk_16, chunk_32, sentence, full_buffered]
  # strict blocks controversial+unsafe; conservative blocks unsafe only.
  policies:
    strict: [controversial, unsafe]
    conservative: [unsafe]
  # Debouncing from the Qwen3Guard report: a response is flagged at token i only if
  # tokens i-1 and i are both blocking.
  trigger_mode: consecutive
  trigger_count: 2
  max_sentence_tokens: 128
  output_dir: data/interim/qwen3guard_stream_0_6b
runtime:
  device: null
  resume: true
