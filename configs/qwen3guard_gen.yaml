dataset:
  repository: inclusionAI/SingStreamBench
  revision: 957b703ca028af6aa834b95ec0893b81e4d24a71
  prepared_path: data/processed/singstreambench.parquet
model:
  adapter: qwen3guard_gen
  repository: Qwen/Qwen3Guard-Gen-0.6B
  # Paste the commit that was scored: model_revision in data/interim/qwen3guard_gen/full/run_metadata.json
  revision: fada3b2f655b89601929198343c94cd2f64d93cc
  tokenizer_revision: fada3b2f655b89601929198343c94cd2f64d93cc
experiment:
  profile: smoke2
  seed: 42
  # Gen reads a finished dialogue, so the guard is called only at the checkpoints of these
  # modes. The token mode would need one model call per token and is not scored.
  modes: [chunk_8, chunk_16, chunk_32, sentence, full_buffered]
  # strict blocks controversial+unsafe; conservative blocks unsafe only.
  policies:
    strict: [controversial, unsafe]
    conservative: [unsafe]
  # Decisions exist only at buffer checkpoints; each mode is replayed on its own checkpoints.
  checkpoint_scoring: true
  # One verdict at a checkpoint is enough to stop: there is no per-token signal to debounce.
  trigger_count: 1
  max_sentence_tokens: 128
  output_dir: data/interim/qwen3guard_gen
runtime:
  device: null
  resume: true
