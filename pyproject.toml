[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamguard-bench"
version = "0.1.0"
description = "A reproducible benchmark for streaming guardrail evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "datasets>=3.0",
  "huggingface-hub>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=17",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
analysis = [
  "jupyter>=1.1",
  "matplotlib>=3.9",
  "seaborn>=0.13",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]
models = [
  "accelerate>=1.2",
  "torch>=2.5",
  "transformers==4.55.0",
]
tokenization = [
    "tiktoken>=0.14",
    "pysbd>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["network: tests that access remote services"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
